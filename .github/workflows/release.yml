name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win-x64
            args: --win --x64
            updater_metadata: true
          - runner: windows-11-arm
            target: win-arm64
            args: --win --arm64
            updater_metadata: false
          - runner: macos-15-intel
            target: mac-x64
            args: --mac --x64
            updater_metadata: false
          - runner: macos-latest
            target: mac-arm64
            args: --mac --arm64
            updater_metadata: false
          - runner: ubuntu-latest
            target: linux-x64
            args: --linux --x64
            updater_metadata: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            args: --linux --arm64
            updater_metadata: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Package ${{ matrix.target }}
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MQTTape-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Upload x64 update metadata
        if: matrix.updater_metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MQTTape-${{ matrix.target }}-update-metadata
          path: |
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: MQTTape-*
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          if ! awk -v version="$version" '
              index($0, "## [" version "]") == 1 { found = 1; next }
              found && /^---$/ { exit }
              found { print }
              END { if (!found) exit 2 }
            ' CHANGELOG.md | sed -e 's/^### /## /' -e 's/^\* /- /' > release-notes.md; then
            echo "CHANGELOG.md 找不到 $RELEASE_TAG 的發布明細" >&2
            exit 1
          fi

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md 找不到 $RELEASE_TAG 的發布明細" >&2
            exit 1
          fi

          summary="$(grep -m1 -E '^[*-] \*\*[^*]+\*\*[:：]?' release-notes.md | sed -E 's/^[*-] \*\*([^*]+)\*\*[:：]?.*$/\1/' || true)"
          if [[ -z "$summary" ]]; then
            echo "CHANGELOG.md 的 $RELEASE_TAG 缺少可作為標題的粗體重點" >&2
            exit 1
          fi
          printf 'MQTTape %s - %s\n' "$RELEASE_TAG" "$summary" > release-title.txt

          cat >> release-notes.md <<'EOF'

          ## 📦 下載與更新

          | 平台 | 架構 | 檔案格式 | 更新支援 |
          |---|---|---|---|
          | **Windows** | x64 | NSIS 安裝檔 (`Setup.exe`) / Portable 免安裝版 | 🟢 安裝版支援背景自動更新 |
          | **Windows** | ARM64 | NSIS 安裝檔 (`Setup.exe`) / Portable 免安裝版 | ⚪ 手動下載更新 |
          | **macOS** | Apple Silicon | DMG 映像檔 (`.dmg`) / ZIP 壓縮檔 | ⚪ 手動下載更新 |
          | **macOS** | Intel x64 | DMG 映像檔 (`.dmg`) / ZIP 壓縮檔 | ⚪ 手動下載更新 |
          | **Linux** | x64 (AMD64) | AppImage / Debian 套件 (`.deb`) | 🟢 支援背景自動更新 |
          | **Linux** | ARM64 | AppImage / Debian 套件 (`.deb`) | ⚪ 手動下載更新 |
          | **Web Lite** | 瀏覽器 | [線上即開即用](https://nickyclin.github.io/mqttape/) | 🟢 瀏覽器載入已部署版本 |

          ## 🛡️ 完整性與簽章狀態

          - Release 內附 `SHA256SUMS.txt`；請計算下載檔案的 SHA-256，並與清單中的同名項目核對。
          - Linux／macOS：`sha256sum <檔案名稱>`
          - Windows PowerShell：`Get-FileHash <檔案名稱> -Algorithm SHA256`
          - 在 SignPath 申請核准並完成簽章流程接線前，Windows 套件維持未簽章；macOS 套件目前也尚未加入 Apple Developer ID 簽名與公證。
          - 詳細狀態請參閱 [SignPath 啟用手冊](https://github.com/NickYCLin/mqttape/blob/main/docs/SIGNPATH.md) 與 [Release 自動化與版本規則](https://github.com/NickYCLin/mqttape/blob/main/docs/RELEASE_AUTOMATION.zh-TW.md)。
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$(cat release-title.txt)" \
            --notes-file release-notes.md \
            --verify-tag

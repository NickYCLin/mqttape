version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Vite and its React plugin share a strict major-version peer contract.
      vite-major:
        patterns:
          - vite
          - '@vitejs/plugin-react'
          - electron-vite
        update-types:
          - major
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # electron-vite 5 only accepts Vite 7. Unblock this trio together after a
    # stable electron-vite release adds Vite 8 support. typescript-eslint 8
    # supports TypeScript 6 but not 7, so hold only that unsupported major.
    ignore:
      - dependency-name: vite
        versions:
          - 8.x
      - dependency-name: '@vitejs/plugin-react'
        versions:
          - 6.x
      - dependency-name: electron-vite
        versions:
          - 6.x
      - dependency-name: typescript
        versions:
          - 7.x
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - '*'
